name: Update README cards

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-readme-cards.yml
      - .github/scripts/update-readme-cards.mjs
  pull_request:
    paths:
      - README.md
      - .github/workflows/update-readme-cards.yml
      - .github/scripts/update-readme-cards.mjs
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and validate cards from public data
        run: node .github/scripts/update-readme-cards.mjs
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update README cards"
          git push
